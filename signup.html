<form id="signupForm">
<div class="formcard">

<h2>Create Account</h2>

<div class="input-group">
    <label>Name</label><br><br>
<input type="text" id="fullName" placeholder="e.g. John Doe" required></br>
</div>

<div class="input-group">
    <label>Phone Number</label><br><br>
    <input type="tel" id="phone" placeholder="Enter 10 digit number" pattern="[0-9]{10}" maxlength="10"minlength="10"required><br>
    
</div>
<div class="input-group">
<label>Email Address</label></br></br>
<input type="email" id="email" placeholder="name@company.com" required></br>
</div>

<div class="input-group">
<label>Password</label></br></br>
<input type="password" id="password" placeholder="••••••••" required></br>
</div>

<button type="submit">Sign Up</button>

<p class="footer-text">Already have an account? 
<a href="signin.html">Sign In</a>
</p>

</div>
</form>

<script>
document.getElementById("signupForm").addEventListener("submit", function(e){
    e.preventDefault();

    let user = {
        name: document.getElementById("fullName").value,
        phone: document.getElementById("phone").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value
    };
     

    let users = JSON.parse(localStorage.getItem("users")) || [];

    users.push(user);

    localStorage.setItem("users", JSON.stringify(users));

    alert("Signup Successful!");

    window.location.href = "signin.html";
});
</script>

</body>
</html>
