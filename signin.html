<div class="formcard">
<h2>Login</h2>

<input id="loginPhone" placeholder="Phone Number"><br><br>
<input id="loginPassword" type="password" placeholder="Password"><br><br>

<button onclick="loginUser()">Login</button>

<p id="errorMsg" style="color:red;"></p>

</div>

<script>
function loginUser(){

let phone = document.getElementById("loginPhone").value.trim();
let password = document.getElementById("loginPassword").value.trim();
let error = document.getElementById("errorMsg");


error.innerText = "";


if(phone === "" || password === ""){
    error.innerText = "Please fill all fields!";
    return;
}


if(phone.length < 10){
    error.innerText = "Enter valid phone number!";
    return;
}


let users = JSON.parse(localStorage.getItem("users")) || [];


let validUser = users.find(u => u.phone === phone && u.password === password);


if(validUser){
    localStorage.setItem("currentUser", JSON.stringify(validUser));
    alert("Login Successful");
    window.location.href = "dashboard.html";
}else{
    error.innerText = "Invalid phone or password!";
}
}
</script>
