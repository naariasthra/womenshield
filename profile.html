<div class="formcard">

<h2>User Profile</h2>

<div id="profileContainer">
<p><strong>Name:</strong> <span id="displayBtnName"></span></p>
<p><strong>Phone:</strong> <span id="displayPhone"></span></p>
<p><strong>Email:</strong> <span id="displayEmail"></span></p>
</div>

<div style="text-align:center; margin-top:30px;">
<button onclick="logout()" class="logoutBtn">
Logout
</button>

</div>

</div>

<script>

function logout(){

localStorage.removeItem("currentUser");

alert("Logged Out Successfully");

window.location.href = "index.html";

}

window.onload = function() {

let user = JSON.parse(localStorage.getItem("currentUser"));

if(user){
document.getElementById('displayBtnName').innerText = user.name;
document.getElementById('displayPhone').innerText = user.phone;
document.getElementById('displayEmail').innerText = user.email;

}
}
</script>
